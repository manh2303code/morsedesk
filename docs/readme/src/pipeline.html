<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MorseDesk pipeline</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 1200px; height: 700px; }
  .title { left: 48px; top: 26px; font-size: 40px; transform: rotate(-1deg); }
  .box { position: absolute; padding: 13px 14px 0 46px; }
  .box .name { font-size: 22px; display: block; line-height: 1.12; }
  .box .sub { font-size: 15px; display: block; margin-top: 6px; line-height: 1.22; }
  .num { position: absolute; left: 12px; top: 12px; width: 24px; text-align: center; font-size: 21px; color: var(--pencil); }
  .time { position: absolute; right: 8px; top: -26px; font-size: 16px; }
  .sample { font-size: 24px; display: block; margin-top: 8px; line-height: 1.3; padding-right: 8px; }
  .sample .weak { text-decoration: underline; text-decoration-color: #e0b100; text-decoration-thickness: 3px;
                  text-underline-offset: 7px; }
  .note-beam { left: 650px; top: 268px; font-size: 23px; transform: rotate(-3deg); width: 300px; }
  .note-keyed { left: 318px; top: 598px; font-size: 22px; transform: rotate(-2deg); width: 260px; }
  .foot { left: 48px; top: 668px; font-size: 15px; }
</style>
</head>
<body class="grid-paper">
<div class="abs hand title" data-t="pipe.title"></div>
<div id="boxes"></div>
<div class="abs note note-beam" data-t="pipe.note_beam"></div>
<div class="abs note note-keyed" data-t="pipe.note_keyed"></div>
<div class="abs print foot" data-t="pipe.foot"></div>
<svg class="overlay" id="ov"></svg>
<script src="vendor/rough.js"></script>
<script src="strings.js"></script>
<script src="common.js"></script>
<script>
// Hộp: [khóa chuỗi, số thứ tự, x, y, rộng, cao]. Hai dòng đọc từ trái sang phải; mũi tên "về đầu dòng" như
// máy chữ nối dòng trên xuống dòng dưới; bộ giải cổ điển chạy song song từ bước tìm tone.
const BOXES = [
  ["s1", "1", 48, 116, 200, 112], ["s2", "2", 276, 116, 200, 112], ["s3", "3", 504, 116, 200, 112],
  ["s4", "4", 732, 116, 200, 112], ["s5", "5", 960, 116, 200, 112],
  ["classic", "", 276, 274, 200, 104],
  ["s6", "6", 48, 464, 236, 120], ["s7", "7", 312, 464, 236, 120], ["s8", "8", 576, 464, 236, 120],
  ["s9", "9", 840, 464, 320, 120],
];
MD.ready(() => {
  const host = document.getElementById("boxes");
  const geo = {};
  for (const [k, n, x, y, w, h] of BOXES) {
    geo[k] = { x, y, w, h };
    const b = document.createElement("div");
    b.className = "box";
    Object.assign(b.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
    if (!n) b.style.paddingLeft = "16px";
    const [name, sub, time] = MD.get("pipe." + k);
    b.innerHTML = (n ? `<span class="hand num">${n}</span>` : "") +
      `<span class="hand name"></span>` + (sub ? `<span class="print sub"></span>` : "") +
      (time ? `<span class="print time"></span>` : "");
    MD.setText(b.querySelector(".name"), name);
    if (sub) b.querySelector(".sub").textContent = sub;
    if (time) b.querySelector(".time").textContent = time;
    if (k === "s9") {                                     // văn bản thật, từ kém chắc gạch chân vàng
      const s = document.createElement("span");
      s.className = "hand sample";
      MD.get("pipe.sample").split(" ").forEach((wd, i) => {
        const span = document.createElement("span");
        span.textContent = wd;
        if (i === MD.get("pipe.sample_weak")) span.className = "weak";
        s.appendChild(span);
        s.appendChild(document.createTextNode(" "));
      });
      b.appendChild(s);
    }
    host.appendChild(b);
  }
  const ov = document.getElementById("ov");
  const rc = rough.svg(ov);
  const ink = MD.css("--ink"), pencil = MD.css("--pencil"), note = MD.css("--note");
  let seed = 3;
  for (const [k, n] of BOXES) {
    const { x, y, w, h } = geo[k];
    ov.appendChild(rc.rectangle(x, y, w, h, { stroke: k === "classic" ? pencil : ink, strokeWidth: 1.7,
      roughness: 1.1, bowing: 1.2, seed: seed++, strokeLineDash: k === "classic" ? [7, 6] : undefined }));
    if (n) ov.appendChild(rc.circle(x + 24, y + 26, 30, { stroke: pencil, strokeWidth: 1.2, roughness: 1.3, seed: seed++ }));
  }
  const A = (x1, y1, x2, y2, o) => MD.arrow(rc, ov, x1, y1, x2, y2, Object.assign({ stroke: ink, bow: 0.06, head: 11, seed: seed++ }, o));
  // dòng trên
  for (const [a, b] of [["s1", "s2"], ["s2", "s3"], ["s3", "s4"], ["s4", "s5"]]) {
    const g1 = geo[a], g2 = geo[b];
    A(g1.x + g1.w + 4, g1.y + g1.h / 2, g2.x - 4, g2.y + g2.h / 2);
  }
  // về đầu dòng: từ bước 5 xuống, sang trái, vào bước 6
  const g5 = geo.s5, g6 = geo.s6;
  const yRet = 422;
  ov.appendChild(rc.path(`M ${g5.x + g5.w / 2} ${g5.y + g5.h + 4} C ${g5.x + g5.w / 2} ${yRet - 10}, ${g5.x + g5.w / 2 - 10} ${yRet}, ${g5.x + g5.w / 2 - 60} ${yRet} L ${g6.x + 110} ${yRet}`,
    { stroke: ink, strokeWidth: 1.8, roughness: 0.9, seed: seed++ }));
  A(g6.x + 110, yRet, g6.x + 96, g6.y - 4, { bow: 0.25 });
  // bộ giải cổ điển: song song từ bước 2, nhập lại ở bước 6
  const g2 = geo.s2, gc = geo.classic;
  A(g2.x + g2.w / 2, g2.y + g2.h + 4, gc.x + gc.w / 2, gc.y - 4, { stroke: pencil, bow: 0 });
  A(gc.x + 20, gc.y + gc.h + 4, g6.x + g6.w - 40, g6.y - 4, { stroke: pencil, bow: -0.18 });
  // dòng dưới
  for (const [a, b] of [["s6", "s7"], ["s7", "s8"], ["s8", "s9"]]) {
    const g1 = geo[a], g2b = geo[b];
    A(g1.x + g1.w + 4, g1.y + g1.h / 2, g2b.x - 4, g2b.y + g2b.h / 2);
  }
  // ghi chú bút chì đỏ
  const nb = document.querySelector(".note-beam").getBoundingClientRect();
  MD.arrow(rc, ov, nb.right - 30, nb.top + 4, g5.x + 40, g5.y + g5.h + 8, { stroke: note, bow: 0.2, seed: 91 });
  const g7 = geo.s7;
  const nk = document.querySelector(".note-keyed").getBoundingClientRect();
  MD.arrow(rc, ov, nk.left + 30, nk.top + 2, g7.x + 26, g7.y + g7.h + 6, { stroke: note, bow: -0.35, seed: 93 });
});
</script>
</body>
</html>
