[project]
name = "morsedesk"
version = "0.1.0"
description = "Offline Morse decoder and encoder for English, Russian and Kazakh"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "soundfile>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
runtime = ["onnxruntime>=1.17", "sounddevice>=0.4.6"]
# PySide6-Essentials thay cho meta PySide6: bản meta kéo thêm PySide6-Addons với QtCharts,
# QtDataVisualization, QtGraphs... không phát hành theo LGPL (dự án đóng nguồn, tuần 6 đóng gói
# AppImage). Ứng dụng chỉ dùng QtCore/QtGui/QtWidgets. Trần pyqtgraph theo Minor M8.
gui = ["PySide6-Essentials>=6.6,<7", "pyqtgraph>=0.13,<0.15"]
train = ["torch>=2.2", "onnx>=1.15", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.5", "pytest-qt>=4.2"]

[project.scripts]
morsedesk = "morsedesk.cli:main"
morsedesk-gui = "morsedesk.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morsedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not gate'"
markers = [
  "gate: chạy model đã huấn luyện trên T1/roundtrip; cần models/acoustic.onnx; chạy bằng -m gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
